<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Gerenciamento de Alunos</title>
    <link rel="stylesheet" href="../../css/gerenciamento_aluno.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="../../assets/logo-equipe.png" alt="Logo da academia Iron Fight">
            </div>
            <div class="pags">
                <ul id="ul-header">
                    <li><a href="professor.html" class="efeito">Home</a></li>
                    <li><a href="calendario_professor.html" class="efeito">Calendário</a></li>
                    <li><a href="aula_agendada_professor.html" class="efeito">Aulas Agendadas</a></li>
                    <li><a href="aula_experimental_professor.html" class="efeito">Aulas Experimentais</a></li>
                    <li><a href="gerenciamento_aluno.html" class="efeito">Gerenciamento de Alunos</a></li>
                    <li><a href="gerenciamento_professor.html" class="efeito">Gerenciamento de Professores</a></li>
                    <div id="sair">
                        <i class="bi bi-box-arrow-right"></i>
                        <li><a href="../home.html" id="link-sair">Sair</a></li>
                    </div>
                </ul>
            </div>
        </nav>
        <div class="title">
            <i class="bi bi-arrow-left-circle" onclick="Voltar()"></i>
            <h1>gerenciamento de alunos</h1>
        </div>
    </header>

    <!-- MODAL SAIR -->
    <div class="modal-sair" id="modal-sair">
        <div class="modal-content-sair">
            <div class="icon-sair">
                <i class="bi bi-check-lg"></i>
                <p>Você saiu da sua conta!</p>
            </div>
        </div>
    </div>

    <main>

        <div class="conteudo">

            <!-- PESQUISA -->
            <div class="pesquisa">
                <div class="barra-pesquisa">
                    <i class="bi bi-search"></i>
                    <input type="text" id="pesquisa-aluno" placeholder="Pesquisar aluno...">
                </div>
            </div>

            <!-- TABELA -->
            <div class="tabela-container">
                <table class="tabela-usuarios">

                    <thead>
                        <tr>
                            <th id="nome">Nome</th>
                            <th id="email">E-mail</th>
                            <th id="acao">Ação</th>
                        </tr>
                    </thead>

                    <tbody id="tbody-alunos">
                        <tr>

                            <td>
                                <button class="btn-acao btn-editar">
                                    <i class="bi bi-pencil"></i>
                                </button>

                                <button class="btn-acao btn-excluir">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>

                        </tr>
                    </tbody>

                </table>
            </div>

        </div>

        <!-- FORM -->
        <article>
            <h2>Cadastrar novo Aluno</h2>

            <form action="" method="" id="form-aluno">
                <label for="text">Nome Completo:</label>
                <input type="text" name="nome" id="input-nome" placeholder="Digite o nome completo">

                <label for="data">Data de Nascimento:</label>
                <input type="date" name="nascimento" id="input-nascimento">

                <label for="e-mail">E-mail:</label>
                <input type="email" name="e-mail" id="input-email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$"
                    placeholder="Digite o e-mail">

                <label for="telefone">Telefone:</label>
                <input type="tel" name="telefone" id="input-telefone" pattern="\(\d{2}\)\s\d{5}-\d{4}"
                    title="(99) 99999-9999" placeholder="Digite o número de telefone">

                <label for="text">Endereço:</label>
                <input type="text" name="endereco" id="input-endereco" placeholder="Digite o endereço">

                <label for="select">Mdalidade:</label>
                <select name="modalidade" id="input-modalidade">
                    <option value=""></option select>
                    <option value="Boxe">Boxe</option>
                    <option value="Jiu Jitsu">Jiu Jitsu</option>
                    <option value="Judô">Judô</option>
                    <option value="Krav Maga">Krav Maga</option>
                    <option value="MMA">MMA</option>
                    <option value="Muay Thai">Muay Thai</option>
                </select>

                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="input-senha">

                <div class="buton-form">
                    <button type="button" id="cancelar-form"><i class="bi bi-trash"></i>Cancelar</button>
                    <button type="submit" id="salvar-form"><i class="bi bi-floppy"></i>Cadastrar</button>
                </div>
            </form>
        </article>

    </main>

    <script>

        // FUNÇÃO VOLTAR
        function Voltar() {
            window.location.href = "professor.html";
        }

        // MODAL SAIR
        const modalSair = document.getElementById("modal-sair");
        const linkSair = document.getElementById("link-sair");

        linkSair.addEventListener("click", (e) => {
            e.preventDefault();
            modalSair.classList.add("active");

            setTimeout(() => {
                window.location.href = "../home.html";
            }, 2000);
        });

        // ELEMENTOS
        const form = document.getElementById("form-aluno");
        const tbody = document.getElementById("tbody-alunos");
        const pesquisa = document.getElementById("pesquisa-aluno");

        const inputNome = document.getElementById("input-nome");
        const inputNascimento = document.getElementById("input-nascimento");
        const inputEmail = document.getElementById("input-email");
        const inputTelefone = document.getElementById("input-telefone");
        const inputEndereco = document.getElementById("input-endereco");
        const inputModalidade = document.getElementById("input-modalidade");
        const inputSenha = document.getElementById("input-senha");

        let alunos = JSON.parse(localStorage.getItem("alunos")) || [];

        // RENDER
        function renderizar(lista = alunos) {
            tbody.innerHTML = "";

            lista.sort((a, b) => a.nome.localeCompare(b.nome));

            lista.forEach((aluno, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${aluno.nome}</td>
                        <td>${aluno.email}</td>
                        <td>
                            <button class="btn-acao btn-editar" data-index="${index}">
                <i class="bi bi-pencil"></i>
            </button>
                            <button class="btn-acao btn-excluir" data-index="${index}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            document.querySelectorAll(".btn-excluir").forEach(btn => {

                btn.addEventListener("click", () => {

                    const i = btn.dataset.index;

                    const alunoExcluido = alunos[i];

                    if (confirm(`Deseja excluir ${alunoExcluido.nome}?`)) {

                        // REMOVE O ALUNO
                        alunos.splice(i, 1);

                        // SALVA NOVAMENTE
                        localStorage.setItem(
                            "alunos",
                            JSON.stringify(alunos)
                        );

                        // SE O USUÁRIO EXCLUÍDO ESTIVER LOGADO
                        const usuarioLogado =
                            JSON.parse(localStorage.getItem("usuarioLogado"));

                        if (
                            usuarioLogado &&
                            usuarioLogado.email === alunoExcluido.email
                        ) {

                            // REMOVE LOGIN
                            localStorage.removeItem("usuarioLogado");
                        }

                        alert("Aluno excluído com sucesso!");

                        renderizar();
                    }

                });

            });
        }

        // CADASTRAR
        form.addEventListener("submit", (e) => {
            e.preventDefault();

            if (
                !inputNome.value ||
                !inputNascimento.value ||
                !inputEmail.value ||
                !inputTelefone.value ||
                !inputEndereco.value ||
                !inputModalidade.value ||
                !inputSenha.value
            ) {
                alert("Preencha todos os campos!");
                return;
            }

            alunos.push({
                nome: inputNome.value,
                nascimento: inputNascimento.value,
                email: inputEmail.value,
                telefone: inputTelefone.value,
                endereco: inputEndereco.value,
                // Alteração aqui: salvamos como uma lista contendo a modalidade selecionada
                modalidadesMatriculadas: [inputModalidade.value],
                senha: inputSenha.value
            });

            localStorage.setItem("alunos", JSON.stringify(alunos));

            form.reset();
            renderizar();
        });

        // PESQUISA
        pesquisa.addEventListener("input", () => {
            const valor = pesquisa.value.toLowerCase();

            const filtrados = alunos.filter(a =>
                a.nome.toLowerCase().includes(valor) ||
                a.email.toLowerCase().includes(valor)
            );

            renderizar(filtrados);
        });

        // CANCELAR
        document.getElementById("cancelar-form").addEventListener("click", () => {
            form.reset();
            alert("Cadastro cancelado!");
        });

        renderizar();
    </script>

</body>

</html>
